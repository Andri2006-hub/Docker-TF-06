version: '3.8'

services:
  web:
    build:
      context: ./nginx
      dockerfile: Dockerfile
    container_name: tf06-nginx
    ports:
      - "80:80"
    networks:
      - tf06-network
    depends_on:
      - cache
    environment:
      - NGINX_HOST=localhost
      - NGINX_PORT=80

  cache:
    image: redis:alpine
    container_name: tf06-redis
    ports:
      - "6379:6379"
    networks:
      - tf06-network
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

volumes:
  redis_data:
    driver: local

networks:
  tf06-network:
    driver: bridge
